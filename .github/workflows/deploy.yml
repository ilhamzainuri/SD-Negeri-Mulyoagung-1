name: 🚀 Build & Deploy ke Hostinger

on:
  push:
    branches:
      - prodtest          # Ubah ke nama branch produksi Anda (main / master / prodtest)

jobs:
  build-and-deploy:
    name: Build React & Deploy via FTP
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout kode dari repository
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '19'
          cache: 'npm'

      # 3. Install dependencies
      - name: 📦 Install Dependencies
        run: npm ci

      # 4. Build Vite (hasil masuk ke folder dist/)
      - name: 🔨 Build Frontend (Vite)
        run: npm run build

      # 5. Deploy dist/ (Frontend) ke root public_html/
      - name: 🌐 Deploy Frontend (dist/) ke public_html/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: ./dist/
          server-dir: /public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      # 6. Deploy backend/ ke public_html/backend/
      - name: 🐘 Deploy Backend PHP ke public_html/backend/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: ./backend/
          server-dir: /public_html/backend/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/*.sql
